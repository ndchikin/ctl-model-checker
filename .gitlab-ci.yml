stages:
  - docker
  - build
  - test
  - upload

variables:
  DOCKER_IMAGE: docker:23
  CONTAINER_IMAGE: $CI_REGISTRY_IMAGE:latest
  GIT_SUBMODULE_STRATEGY: recursive

image: $CONTAINER_IMAGE

docker:
  image: $DOCKER_IMAGE
  stage: docker
  services:
    - $DOCKER_IMAGE
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker build --cache-to type=inline --cache-from $CONTAINER_IMAGE -t $CONTAINER_IMAGE .
    - docker push $CONTAINER_IMAGE
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - Dockerfile

build:
  stage: build
  script:
    - mkdir build && cd build
    - export CC=clang-15 CXX=clang++-15
    - cmake -G Ninja -DCMAKE_BUILD_TYPE=Release ..
    - cmake --build . && cmake --install .
  artifacts:
    paths:
      - build/
      - programs/

test:
  stage: test
  script:
    - cd build
    - ctest -VV

upload:
  stage: upload
  script:
    - FILE_PATH=$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/ctl-model-checker/0.1/ctl-model-checker
    - 'curl --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file programs/ctl-model-checker $FILE_PATH'
  rules:
    - when: manual
